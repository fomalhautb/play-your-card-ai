# 前端静态资源和服务端部署成同一个 Worker，所以只有这一条部署流水线。
name: 部署到 Cloudflare Workers

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      # job 级的 if 读不到 secrets（GitHub 只在 step 级展开 secrets 上下文），
      # 所以先在这一步把"凭据齐不齐"写成 output，后面的步骤再按它跳过。
      # 这样没配 secret 的仓库（比如别人 fork 的）工作流是绿色跳过，而不是红色失败。
      #
      # 只检查 token 一个：账户 ID 不是凭据，直接写在 wrangler.jsonc 里了。
      - name: 检查 Cloudflare 凭据
        id: credentials
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ]; then
            echo 'ready=true' >> "$GITHUB_OUTPUT"
          else
            echo 'ready=false' >> "$GITHUB_OUTPUT"
            echo '::notice::仓库没有配置 CLOUDFLARE_API_TOKEN，跳过部署。配置方法见 docs/deploy.md。'
          fi

      - name: 安装 pnpm
        if: steps.credentials.outputs.ready == 'true'
        uses: pnpm/action-setup@v4

      - name: 安装 Node.js
        if: steps.credentials.outputs.ready == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: 安装依赖
        if: steps.credentials.outputs.ready == 'true'
        run: pnpm install --frozen-lockfile

      # 必须先构建：wrangler.jsonc 里 assets.directory 指向 apps/web/dist，
      # 这个目录是 gitignore 掉的，仓库里没有。
      #
      # 卡面图集和界面底图是 `pnpm assets:build` 的产物，落在 apps/web/public 下，
      # 同样不进仓库，所以也得在这儿现打一份——少了它页面起来是空的。
      - name: 打图集和素材
        if: steps.credentials.outputs.ready == 'true'
        run: pnpm assets:build

      - name: 构建前端
        if: steps.credentials.outputs.ready == 'true'
        run: pnpm --filter @ai-duel/web build

      # 账号库的建表要走在部署前面：新代码一上线就会去查 user / session / jwks 这几张表，
      # 表还没建的话第一个来登录的人直接报 500。
      # 反过来（先建表再部署）最多是库里多几张暂时没人用的表，没有风险。
      # 这条命令是幂等的，wrangler 按 d1_migrations 表记账，已经跑过的不会再跑一遍。
      - name: 应用账号库迁移
        if: steps.credentials.outputs.ready == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          workingDirectory: packages/server
          command: d1 migrations apply AUTH_DB --remote

      - name: 部署 Worker
        if: steps.credentials.outputs.ready == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          workingDirectory: packages/server
          command: deploy
