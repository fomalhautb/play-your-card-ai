# 《正式版架构》6.1 的「慢档」：合进 main 之后跑，也能手动触发。
#
# 现在有三样东西在这里：
#
# - **性能剧本的确定性指标**（6.9）。它本来是想放快档的，第 18 条接上真对局场景之后
#   实测整批 17 分钟、最慢一条 12.9 分钟（M2 上，无头软件渲染），
#   两核的 ubuntu 跑机只会更慢，10 分钟的快档装不下。
# - **三浏览器一致性**（6.10，迁移第 34 条）。它放这里的理由**不是慢**（本机十六条 20 秒），
#   是它拦的不是 PR 级别的岔子：某一家画错了这种事多半跟着浏览器版本走，
#   不跟着这一次改动走；而且它要多装两个浏览器（webkit 的 `--with-deps` 在 ubuntu 上
#   是一大串系统库）。快档因此只留 Chromium 一家，见 ci.yml。
# - **平台壳的构建**（6.11，迁移第 37 条）那条「四端构建都能过」：网页、Steam 三格、安卓一格。
#   **iOS 那一端不在这里**：`xcodebuild` 只能在 macOS 跑机上跑，而 macOS 跑机按十倍计费，
#   为「构建能不能过」这一条结论天天付这个价不值得。它靠人在本机验，命令写在
#   apps/mobile/README.md 里。
#   「构建能过本身就是测试」——平台壳最容易在没人看的时候坏掉，而它不像别的包有单元测试守着。
#
# 前两样的拆法都是**开成一格一格的并行 job**（确定性指标按「视口 × 剧本」，三浏览器按
# 「浏览器 × 剧本」）：每条用例各开各的页面和渲染进程，
# 之间没有任何耦合（同一段剧本的数字和跑得快慢无关，见 playwright.config.ts），
# 所以拆开只是把墙钟时间从"最慢那一条 + 排队"压到"最慢那一条"。
# 一格红了只说明那一格超限，别的格照跑（fail-fast: false）。
#
# 时间指标（帧时间 p50/p95、主线程脚本时间、GPU 每帧耗时）**不在这里**：
# 它机器相关、只出数不设门禁，而 GitHub 跑机既没 GPU 又跑在软件渲染上，量出来没有参考价值。
# 那一组只在开发者本机跑，怎么跑和怎么和 main 比见 packages/bench/README.md。
name: CI 慢档

on:
  push:
    branches: [main]
  workflow_dispatch:

# 同一个分支上连着推几次时掐掉旧的：慢档一跑十几分钟，排队跑几个月前的提交没有意义。
concurrency:
  group: slow-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bench:
    name: 确定性指标 ${{ matrix.profile }}/${{ matrix.segment }}
    runs-on: ubuntu-latest
    # 这里原来是 20 分钟，按「M2 上最慢一格 6.8 分钟 × 三倍」估的。第一次真跑完发现估少了
    # （运行 34674939419，一格一台跑机、谁也不抢谁的核）：desktop/deal 实测 13.9 分钟，
    # desktop/play10、desktop/settle、mobile/play10 三格跑满 15 分钟的**用例**超时被掐。
    # 掐的位置都在第三轮上（前两轮跑完了、上限断言全过），也就是说它们不是卡住，是跑不完：
    # 一条用例要把同一段剧本跑三轮，而两核跑机上的 SwiftShader 比 M2 慢三倍多。
    # 推算最慢的 desktop/play10 整条约 24 分钟，用例超时因此提到 35 分钟
    # （见 packages/bench/playwright.config.ts，那儿写了怎么推的）。
    #
    # 这里给 40 分钟：比用例超时多五分钟，刚好够装依赖、装浏览器和打图集那几步。
    # 也就是说掐在这里的只会是「用例超时之外的东西卡住了」，剧本本身变长该由那 35 分钟报。
    #
    # 最轻的几格：mobile/deckScroll 1.8 分钟、mobile/deal 1.9、mobile/settle 2.8、
    # mobile/flip 3.9、desktop/deckScroll 8.7、desktop/flip 8.9（同一次运行）。
    timeout-minutes: 40
    strategy:
      # 一格超限不该把别的格掐掉：一次跑完能看到全部超限项，比一条一条试快得多。
      fail-fast: false
      matrix:
        profile: [desktop, mobile]
        segment: [deal, play10, flip, settle, deckScroll]
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 pnpm
        uses: pnpm/action-setup@v4

      # 顺序不能反：setup-node 的 cache: pnpm 要先能找到 pnpm 才知道去哪儿找 store。
      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 安装 Chromium
        run: pnpm exec playwright install --with-deps chromium

      # 按标签筛出这一格那条用例。标签在 packages/bench/tests/deterministic.spec.ts 上，
      # 形如 `@desktop-play10`——**它是这个工作流的接口**，改了名字这一格会变成
      # 「一条用例都没匹配到」而不是失败，静悄悄地少跑一格，所以下面那条 --pass-with-no-tests 的
      # 反面（默认行为：没匹配到就退非零）是有意留着的。
      - name: 确定性指标
        run: pnpm --filter @ai-duel/bench bench --grep "@${{ matrix.profile }}-${{ matrix.segment }}"

      # 超限的时候把报告目录带出来：里面有逐帧记录和超限条目，光看日志里那几行数字不够查。
      - name: 上传报告
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: bench-${{ matrix.profile }}-${{ matrix.segment }}
          path: |
            packages/bench/results
            packages/bench/test-results

  guard:
    name: 确定性指标 ${{ matrix.label }}
    runs-on: ubuntu-latest
    # 时限口径同上面 bench 那格（用例 35 分钟 + 五分钟装东西的时间）。
    #
    # 跑机上这两条都比本机（桩场景几十秒、泄漏约 3 分钟）慢得多：运行 34674939419 里
    # 桩场景 7.7 分钟，泄漏那条**连十二轮热身都没跑完**就被 15 分钟的用例超时掐了。
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        # 这两条原来挤在同一格里（`--grep "@stub|@leak"`），而这个包在 CI 上开两个 worker，
        # 于是两条用例在两核跑机上一人一核、各慢一倍——泄漏那条要连开二十二轮场景，
        # 正是最吃亏的那一条。拆成两格各占一台跑机，和上面 bench 按「视口 × 剧本」分格同一个道理。
        # 只写 include：这一维不是「所有组合」，就是这两条各一格，顺带给每格一个中文名。
        include:
          - tag: stub
            label: 桩场景
          - tag: leak
            label: 泄漏
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 pnpm
        uses: pnpm/action-setup@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 安装 Chromium
        run: pnpm exec playwright install --with-deps chromium

      # 这两条不按视口 × 剧本分格：桩场景是测量骨架的对照组，泄漏是连跑十轮比堆基线，
      # 两条都只在一个视口上跑一遍就够（见 deterministic.spec.ts 各自的说明）。
      # 标签（@stub / @leak）和上面 bench 那格一样**是这个工作流的接口**，改了名字
      # 这一格会变成「一条用例都没匹配到」而不是失败。
      - name: 跑这一条
        run: pnpm --filter @ai-duel/bench bench --grep "@${{ matrix.tag }}"

      - name: 上传报告
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: bench-guard-${{ matrix.tag }}
          path: |
            packages/bench/results
            packages/bench/test-results

  cross-browser:
    name: 三浏览器一致性 ${{ matrix.browser }}/${{ matrix.segment }}
    runs-on: ubuntu-latest
    # 本机（M2、真 GPU）十六条一共 20 秒，一格两条各两三秒。这个数**不是**按它给的：
    # ubuntu 跑机上 webkit 和 firefox 也落到软件光栅，而快档里同样两条用例的
    # Chromium 软件光栅实测一格 3～5 分钟。按那个量级加上装两个浏览器的时间，
    # 20 分钟（慢档的口径）留了约四倍余量。
    #
    # 第一次真跑完的实测（运行 34674939419，webkit 那四格，含装浏览器和打图集）：
    # 整格 2.2～3.0 分钟，其中两条用例本身各 35～45 秒。余量比估的还厚，20 分钟不用动。
    # firefox 那四格当时一格都没跑起来（无头没 WebGL），它有头 + xvfb 之后要多久还没量到。
    timeout-minutes: 20
    strategy:
      # 一家画错了不该把另一家掐掉：一次跑完能看到全部差异。
      fail-fast: false
      matrix:
        # chromium 不在这里：它拍的图就是被比的那个参照物（见下面）。
        browser: [webkit, firefox]
        segment: [deal, play10, flip, settle]
        include:
          # firefox 在 Linux 上**必须有头**才拿得到 WebGL（无头是写死不给的，
          # 理由见 packages/bench/playwright.config.ts），有头就得有一块屏，
          # 而跑机上没有显示器——所以给它套一层 xvfb（跑机镜像自带，
          # `playwright install --with-deps` 也会确保装上）。
          # `--auto-servernum` 让它自己挑一个没被占的显示号。
          # webkit 照旧无头，这一项对它是空的，那一行命令前面什么也不加。
          - browser: firefox
            xvfb: xvfb-run --auto-servernum
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 pnpm
        uses: pnpm/action-setup@v4

      # 顺序不能反：setup-node 的 cache: pnpm 要先能找到 pnpm 才知道去哪儿找 store。
      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      # 一格只装自己那一家。--with-deps 装的是这个浏览器要的系统库，ubuntu 镜像里默认没有；
      # webkit 那串尤其长，它是这个 job 里除跑用例外最花时间的一步。
      - name: 安装 ${{ matrix.browser }}
        run: pnpm exec playwright install --with-deps ${{ matrix.browser }}

      # 卡面图集是构建产物、不进仓库，Playwright 的 globalSetup 会自己打一份。
      #
      # 三浏览器一致性（6.10）：同一段剧本的同一帧在这一家拍一遍，和 **chromium 拍的那张**
      # 逐像素比。chromium 那张就是 `packages/bench/baselines/linux/` 里的关键帧基线——
      # 快档每个 PR 都会把它重拍一遍并比对（ci.yml 的 keyframes），所以它就是
      # 「此刻 chromium 画出来的样子」，这里不用再跑一遍最贵的那个软件光栅。
      # 反过来说：**这一格依赖仓库里有 linux 基线**，没有时用例会直接抛并告诉你去哪儿生成
      #（见 packages/bench/tests/crossBrowser.spec.ts）。
      #
      # `--project` 和 `--grep` 一起筛出这一格那两条用例（两档视口各一条）。
      # project 名字（keyframes-webkit / keyframes-firefox）在 playwright.config.ts 上、
      # `@剧本段` 标签在那个 spec 上，**两个都是这个工作流的接口**：
      # project 名字改了这一格会直接报错，标签改了这一格会变成「一条用例都没匹配到」
      # 而不是失败，静悄悄地少跑一格。
      - name: 三浏览器一致性
        id: cross
        run: |
          ${{ matrix.xvfb }} pnpm --filter @ai-duel/bench exec playwright test \
            --project=keyframes-${{ matrix.browser }} --grep "@${{ matrix.segment }}"

      # 超了的时候把「这一家拍到的」和「差异图」带出来：光看日志里那个比例
      # 说不出是整块没画、偏色还是层级压反，而这三样的处理方式完全不同。
      - name: 上传截图差异
        if: failure() && steps.cross.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: cross-browser-${{ matrix.browser }}-${{ matrix.segment }}
          path: packages/bench/test-results

  build-steam:
    name: Steam 壳构建 ${{ matrix.label }}
    runs-on: ${{ matrix.os }}
    # 三格里最重的是打包那一步：electron-builder 要现下一份 Electron（一百多兆），
    # 再把几百兆的产物落到磁盘上。本机（M2）整条 1.5 分钟，跑机按几倍估。
    # 20 分钟是慢档的口径，顶破了要查的是构建为什么变长了。
    timeout-minutes: 20
    strategy:
      # 一个系统挂了不该把别的掐掉：一次跑完能看到全部三端的结论。
      fail-fast: false
      matrix:
        include:
          # Linux 出 AppImage（单文件，下下来就能跑）。Steam Deck 上跑的其实是 Windows 版
          # （Proton），这一格的意义是「在 Linux 上也能完整打一次包」，顺带给出一个能上手试的产物。
          - os: ubuntu-latest
            label: linux
            script: pack:linux
            upload: true
          # mac 和 Windows 只出解包后的目录，不打 dmg / 安装器：那两步都要签名证书，
          # 而 Steam 发行本来就是「把目录传上去」。见 apps/steam/electron-builder.yml。
          - os: macos-latest
            label: mac
            script: pack:dir
            upload: false
          - os: windows-latest
            label: windows
            script: pack:dir
            upload: false
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 pnpm
        uses: pnpm/action-setup@v4

      # 顺序不能反：setup-node 的 cache: pnpm 要先能找到 pnpm 才知道去哪儿找 store。
      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      # 卡面图集和界面底图不进仓库（见 .gitignore），而渲染进程的构建会把它们原样打进产物。
      # 不打这一步构建照样能过，但打出来的包里一张图都没有——那种"绿"没有意义。
      - name: 打卡面图集
        run: pnpm assets:build

      # 主进程（tsc → CommonJS）、渲染进程（Vite）、再 electron-builder 打包，
      # 三步都在这一条脚本里（见 apps/steam/package.json）。
      - name: 打包
        run: pnpm --filter @ai-duel/steam ${{ matrix.script }}
        env:
          # mac 跑机上偶尔会摸到一个临时的签名身份，签一半失败反而更难查。
          # 这一步本来就不签名（见 apps/steam/electron-builder.yml），干脆关掉自动探测。
          CSC_IDENTITY_AUTO_DISCOVERY: false

      # **只有 Linux 这一格上传**，而且只留三天。
      #
      # 仓库是私有的，私有仓库的 artifact 存储是按配额计费的，超了之后**上传这一步会直接失败**
      # ——也就是说传大产物的代价不是多花点钱，是几次合并之后慢档整个变红。
      # 三格都传的话一轮就是将近一个 G（mac 的 .app 和 Windows 的目录各三百多兆）。
      #
      # 少传的两格没有损失：mac 和 Windows 这两格的意义本来就是「构建能过」
      #（《正式版架构》6.11：构建能过本身就是测试），产物没人会下下来——
      # 真要在 mac 上试就在自己机器上 `pnpm --filter @ai-duel/steam pack:dir`。
      # Linux 那份留着是因为 AppImage 是单文件、下下来双击就能跑，是三格里唯一能顺手上手试的。
      - name: 上传 AppImage
        if: matrix.upload
        uses: actions/upload-artifact@v4
        with:
          name: steam-${{ matrix.label }}
          path: apps/steam/release
          retention-days: 3
          # 打包这一步过了却一个文件都没有，说明 electron-builder 的输出目录改了。
          # 不设这一条的话它只会警告一句，静悄悄地传一个空包。
          if-no-files-found: error

  build-android:
    name: 安卓壳构建
    runs-on: ubuntu-latest
    # 只有一格，所以没有 strategy / fail-fast：安卓就在 Linux 上构建，没有别的系统可并排。
    # iOS 那一端不在这个工作流里，理由见文件头。
    #
    # 20 分钟是慢档的口径（和 build-steam 一样）。第一次跑要现下 Gradle 发行版和整套依赖，
    # 之后 setup-java 的 gradle 缓存会把这段砍掉大半。顶破了要查的是构建为什么变长了。
    timeout-minutes: 20
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 pnpm
        uses: pnpm/action-setup@v4

      # 顺序不能反：setup-node 的 cache: pnpm 要先能找到 pnpm 才知道去哪儿找 store。
      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # Capacitor 8 的安卓工程按 JDK 21 编译（见 android/app/capacitor.build.gradle 里的
      # sourceCompatibility）。跑机默认的 JDK 不一定是这个版本，所以显式装一份。
      # Android SDK 本身不用装：ubuntu 跑机的镜像自带，许可也已经接受过，
      # 缺哪个平台版本 AGP 会自己下。
      - name: 安装 JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      # 卡面图集和界面底图不进仓库（见 .gitignore），而网页构建会把它们原样打进产物。
      # 不打这一步构建照样能过，但打出来的包里一张图都没有——那种"绿"没有意义。
      - name: 打卡面图集
        run: pnpm assets:build

      # 先出网页产物，再由 cap sync 复制进原生工程并重写那几份生成的 gradle 文件
      # （它们的路径带着 pnpm store 的版本号，所以**必须**在 install 之后 sync 一次）。
      - name: 同步原生工程
        run: pnpm --filter @ai-duel/mobile sync:android

      - name: 构建 debug 包
        run: ./gradlew assembleDebug --no-daemon
        working-directory: apps/mobile/android

      # apk 只有几十兆，而且是这四端里唯一「下下来装到手机上就能试」的产物，所以这一格传。
      # 保留期三天、传不到东西就失败，口径和上面 Steam 那格一样（理由见那儿）。
      - name: 上传 apk
        uses: actions/upload-artifact@v4
        with:
          name: mobile-android-debug
          path: apps/mobile/android/app/build/outputs/apk/debug/*.apk
          retention-days: 3
          # 构建过了却一个文件都没有，说明 Gradle 的输出目录改了。
          # 不设这一条的话它只会警告一句，静悄悄地传一个空包。
          if-no-files-found: error
