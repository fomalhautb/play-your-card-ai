# 手动重新生成组件目录页的 linux 截图基线。
#
# 为什么要单开一条：基线按平台分目录，darwin 那份本机跑 `catalog:update` 就有了，
# linux 那份得有台 Linux 机器。改了组件之后 linux 基线一定过期，而 CI 快档（ci.yml）
# 只会拿它比对、比不过就红——它不生成新的。没有这条工作流的话，唯一的拿法是
# 等 CI 红了再从 catalog-diff 那个 artifact 里把 actual 图一张张扒出来。
#
# 只生成不比对，也不往仓库里写：跑完把整个 baselines/linux 传成 artifact，
# 人下载下来看过再提交（怎么提交见 packages/client/dev/storybook/README.md）。
# 让工作流直接推提交的话，一次误触就把基线洗成了当时那一版的样子，谁都没看过。
#
# 分片和 ci.yml 的 catalog 一样按 `@shard<n>` 标签拆（规则见 catalog.spec.ts）：
# 一格只生成自己那一片的图，所以要把两格的 artifact 都下下来才凑得齐一份完整基线。
# 每格在生成之前会先把 baselines/linux 清空，传出来的 artifact 里因此只有自己那一片——
# 两份直接合并就是完整的一份，谁先谁后都一样。
name: 目录页 linux 基线

on:
  workflow_dispatch:

jobs:
  baselines:
    name: 生成第 ${{ matrix.shard }}/2 片
    runs-on: ubuntu-latest
    # 只跑截图那一步，但比快档慢：生成基线时每条条目要**连拍两张一样的**才算数
    # （快档手上有基线，一张比过就完事），最重的几条一条就要二十多秒。
    # 整页一百多条实测 5 分多钟，分片之后一格约一半，再加上装依赖和装 Chromium，留 25 分钟。
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 pnpm
        uses: pnpm/action-setup@v4

      # 顺序不能反：setup-node 的 cache: pnpm 要先能找到 pnpm 才知道去哪儿找 store。
      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      # 和 ci.yml 一样只装 Chromium：目录页的比对本来就只跑这一个浏览器。
      # --with-deps 装的是无头浏览器要的那些系统库，ubuntu 镜像里默认没有。
      - name: 安装 Chromium
        run: pnpm exec playwright install --with-deps chromium

      # 先把仓库里那份 linux 基线整个删掉，再生成。
      #
      # 不删的话，这一格只重写自己那一片的图，另一片的**旧图**会原样留在目录里跟着 artifact
      # 传出去；两格的 artifact 合并到同一个目录时，后拷进去的那份里的旧图就把前一份刚生成的
      # 新图盖回了上一版。第 28 条的 ui-designtokens--overview 就是这么被顶回去的，
      # 结果是 CI 拿一张过期的基线去比，红了还看不出是基线的问题。
      # 删掉之后每格的 artifact 里只有自己那一片，合并没有先后之分。
      #
      # 对不存在的基线，`catalog:update` 是「生成」而不是「比对」（它本来就只生成不比对），
      # 所以清空不会让这一步失败，只是每张图都要连拍两张，耗时和平时一样。
      - name: 清空旧的 linux 基线
        run: rm -rf packages/client/dev/storybook/baselines/linux

      # 卡面图集是构建产物、不进仓库，截图那步的 globalSetup 会自己打一份。
      # --update-snapshots 会把这一片的图重写一遍（platform 取自 process.platform）。
      - name: 重新生成 linux 基线
        run: pnpm --filter @ai-duel/client catalog:update --grep "@shard${{ matrix.shard }}"

      # artifact 名字带上这一片：v4 不允许两个 job 传同一个名字。
      # 上一步清过场，所以这里传的就是这一格刚生成的那一片，一张多余的都没有——
      # 两格下下来拷进同一个目录才是完整的一份。
      - name: 上传 linux 基线
        uses: actions/upload-artifact@v4
        with:
          name: catalog-baselines-linux-${{ matrix.shard }}
          path: packages/client/dev/storybook/baselines/linux
