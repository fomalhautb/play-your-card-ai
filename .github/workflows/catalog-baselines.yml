# 手动重新生成组件目录页的 linux 截图基线。
#
# 为什么要单开一条：基线按平台分目录，darwin 那份本机跑 `catalog:update` 就有了，
# linux 那份得有台 Linux 机器。改了组件之后 linux 基线一定过期，而 CI 快档（ci.yml）
# 只会拿它比对、比不过就红——它不生成新的。没有这条工作流的话，唯一的拿法是
# 等 CI 红了再从 catalog-diff 那个 artifact 里把 actual 图一张张扒出来。
#
# 不往仓库里写：跑完把这一趟重拍出来的图传成 artifact，
# 人下载下来看过再提交（怎么提交见 packages/client/dev/storybook/README.md）。
# 让工作流直接推提交的话，一次误触就把基线洗成了当时那一版的样子，谁都没看过。
#
# 分片和 ci.yml 的 catalog 一样按 `@shard<n>` 标签拆（规则见 catalog.spec.ts）：
# 一格只重拍自己那一片，所以要把两格的 artifact 都下下来才凑得齐这一趟的全部改动。
# 每格传的只有**自己这一趟改过的那几张**（怎么挑见下面那一步），
# 两份合并到同一个目录不会互相盖，谁先谁后都一样。
# 一片一张都没变时那一格不产出 artifact，这是对的：那一片本来就不用动。
name: 目录页 linux 基线

on:
  workflow_dispatch:

jobs:
  baselines:
    name: 生成第 ${{ matrix.shard }}/2 片
    runs-on: ubuntu-latest
    # 只跑截图那一步，但比快档慢：生成基线时每条条目要**连拍两张一样的**才算数
    # （快档手上有基线，一张比过就完事），最重的几条一条就要二十多秒。
    # 整页一百多条实测 5 分多钟，分片之后一格约一半，再加上装依赖和装 Chromium，留 25 分钟。
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 pnpm
        uses: pnpm/action-setup@v4

      # 顺序不能反：setup-node 的 cache: pnpm 要先能找到 pnpm 才知道去哪儿找 store。
      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      # 和 ci.yml 一样只装 Chromium：目录页的比对本来就只跑这一个浏览器。
      # --with-deps 装的是无头浏览器要的那些系统库，ubuntu 镜像里默认没有。
      - name: 安装 Chromium
        run: pnpm exec playwright install --with-deps chromium

      # 卡面图集是构建产物、不进仓库，截图那步的 globalSetup 会自己打一份。
      # --update-snapshots 把这一片里和现有基线对不上的图就地重写（platform 取自 process.platform）。
      - name: 重新生成 linux 基线
        run: pnpm --filter @ai-duel/client catalog:update --grep "@shard${{ matrix.shard }}"

      # 只挑这一趟真正改过的图，不传整个 baselines/linux。
      #
      # 传整个目录会出事：这一格只重写自己那一片，另一片的**旧图**原样留在目录里跟着传出去，
      # 两格的 artifact 合并到同一个目录时，后拷进去的旧图把前一份刚生成的新图顶回了上一版。
      # 第 28 条的 ui-designtokens--overview 就是这么被顶回去的，CI 于是拿一张过期的基线去比，
      # 红了还看不出问题出在基线上。
      #
      # 挑的办法是问 git：基线是提交进仓库的，这一步跑完哪几张变了、哪几张是新增的，
      # `git diff` 和 `git ls-files --others` 一问便知，不用在这里重写一遍分片规则。
      #
      # 为什么不改成"生成前先把目录清空"（那样传出去的自然也只有自己这一片）：清空之后每张图
      # 都算"新建"，而 Playwright 对不存在的基线要**连拍两张一样的**才认账，整片的耗时和超时
      # 风险都翻倍——第 34508733056 次运行就是这么让结算层那条撞上单张 45 秒的时限红掉的。
      #
      # 上一步红了也要挑（`always()`）：截图那步是 `expect.soft`，一条条目对不上或者超时
      # 不会打断后面的，其余的图照样重拍好了——这时候更需要把它们带出来看。
      # 没写进来的只有真出问题的那几张：Playwright 要连拍两张一样的才落盘，超时就不写。
      - name: 挑出这一趟改过的基线
        if: always()
        run: |
          out=catalog-baselines-out
          base=packages/client/dev/storybook/baselines/linux
          mkdir -p "$out"
          files=$( { git diff --name-only -- "$base"; \
                     git ls-files --others --exclude-standard -- "$base"; } | sort -u )
          for f in $files; do cp "$f" "$out/"; done
          echo "这一趟改过 $(ls -1 "$out" | wc -l) 张："
          ls -1 "$out"

      # artifact 名字带上这一片：v4 不允许两个 job 传同一个名字。
      # 传的是上一步挑出来的那几张，两格下下来拷进 baselines/linux 就是这一趟的全部改动。
      - name: 上传 linux 基线
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: catalog-baselines-linux-${{ matrix.shard }}
          path: catalog-baselines-out
