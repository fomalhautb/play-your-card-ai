# electron-builder 的打包配置（迁移第 35 条，慢档里那一格见 .github/workflows/slow.yml）。
#
# 三个目标都**不签名**：签名要开发者证书，而那是上线前的事，这一步只要「构建能过」
# （《正式版架构》6.11：构建能过本身就是测试，平台壳最容易在没人看的时候坏掉）。
#
# 跑法：`pnpm --filter @ai-duel/steam pack:dir`（当前系统的 --dir 产物）
#       `pnpm --filter @ai-duel/steam pack:linux`（AppImage）
# 两条都会先跑一遍 build，产物在 apps/steam/release/。

appId: online.playyourcardai.game
# 显示名：mac 的 CFBundleName、Linux 桌面项的 Name，也是 AppImage 的产物文件名
# （默认模板 ${productName}-${version}.AppImage，这个宏取的就是这里）。
# ASCII，不用中文名：它会被原样塞进桌面项和 AppImage 启动脚本的 shell 字符串里，
# 中文名在有些系统上会被转义成一串百分号，也不好在命令行里补全。
productName: PlayYourCardAI

# 可执行文件名。**必须显式设**：Linux 这一档的默认值不是 productName，而是 package.json 的
# `name` 去掉 `/` 再小写——本包叫 `@ai-duel/steam`，算出来就是 `@ai-duelsteam`。
# 而 AppImage 会把可执行名当文件路径和 shell 字符串用，带 `@` 的名字 electron-builder
# 直接判错（executableName contains characters that cannot be safely used in file paths），
# 于是 Linux 那一格构建红，mac 和 Windows 却是绿的（那两端的默认值取的是 productName）。
#
# 写在顶层而不是 linux 下面：三端同一个可执行名，不用记「Linux 叫这个、mac 叫那个」。
# 连带效果是 mac 的包目录和 Windows 的 exe 也跟着它叫（ai-duel.app / ai-duel.exe），
# 因为那两个名字取 productFilename，而 productFilename 一旦设了 executableName 就优先取它；
# AppImage 的文件名不受影响（见上面 productName），mac 上 Dock 里显示的也仍是 productName。
# 取 `ai-duel` 是为了和 Cloudflare Worker 的名字（packages/server/wrangler.jsonc）对齐。
executableName: ai-duel
copyright: © play-your-card-ai

directories:
  output: release

# 只打这两样。渲染进程的产物已经由 Vite 打成了一个 bundle，源码和 node_modules 里的
# 那一大堆（react、pixi、client 各包）都不需要跟着走——它们是 devDependencies，
# electron-builder 本来也只收 dependencies。
files:
  - dist/**
  - package.json

# 原生模块和它的动态库不能待在 asar 里：asar 是个只读归档，`dlopen` 打不开里面的文件。
# steamworks.js 那个目录里有三样东西要落地——各平台的 .node、Steam 的
# libsteam_api（.dylib / .so / steam_api64.dll），以及它自己的 index.js。
asarUnpack:
  - node_modules/steamworks.js/**

# 不重新编译原生模块。steamworks.js 是 napi-rs 打的，Node-API 的 ABI 跨版本稳定，
# 预编译的 .node 在任何 Node 20+ / Electron 里都能直接加载，不需要 electron-rebuild 那一套。
npmRebuild: false

mac:
  # 只出 .app 目录，不打 dmg：dmg 那一步要签名和公证。
  target: dir
  category: public.app-category.card-games

win:
  # 同上，只出解包后的目录，不打安装器。Steam 发行本来就是「把目录传上去」，不需要安装器。
  target: dir

linux:
  # Linux 上出 AppImage：Steam Deck 那边跑的是 Windows 版（Proton），
  # 这一格的意义是「在 Linux 跑机上也能完整打一次包」，AppImage 是最省事的单文件格式。
  target: AppImage
  category: Game
